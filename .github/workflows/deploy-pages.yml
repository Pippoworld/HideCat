name: Deploy NEON SWARM to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/game-development-jpaao5
    paths:
      - 'neon-swarm/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish the game folder as the site root, so the URL points straight at the game.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: neon-swarm
      - id: deployment
        uses: actions/deploy-pages@v4
